name: Update GitHub Analytics

on:
  schedule:
    # Update every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==============================
      # Checkout Repository
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==============================
      # GitHub Stats
      # ==============================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true&rank_icon=github'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Top Languages
      # ==============================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Generate Real Contribution Card
      # ==============================

      - name: Generate Contribution Card
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import date, timedelta
          from xml.sax.saxutils import escape

          token = os.environ["GH_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as e:
              print("GitHub GraphQL API error:", e.read().decode())
              raise

          if "errors" in result:
              print(json.dumps(result["errors"], indent=2))
              raise SystemExit("GraphQL request failed")

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          # ==========================================
          # Current Streak
          # ==========================================

          current_streak = 0

          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          # ==========================================
          # Longest Streak
          # ==========================================

          longest_streak = 0
          running_streak = 0

          for day in days:
              if day["count"] > 0:
                  running_streak += 1
                  longest_streak = max(longest_streak, running_streak)
              else:
                  running_streak = 0

          # ==========================================
          # Generate SVG
          # ==========================================

          width = 900
          height = 230

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}"
              role="img"
              aria-label="GitHub contribution analytics">

            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#161b22"/>
                <stop offset="100%" stop-color="#0d1117"/>
              </linearGradient>

              <filter id="shadow">
                <feDropShadow dx="0" dy="4" stdDeviation="8"
                  flood-color="#000000" flood-opacity="0.35"/>
              </filter>
            </defs>

            <rect
              x="0"
              y="0"
              width="{width}"
              height="{height}"
              rx="16"
              fill="url(#bg)"
              stroke="#30363d"
              stroke-width="1"
              filter="url(#shadow)"
            />

            <text
              x="450"
              y="42"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="22"
              font-weight="700"
              fill="#ffffff">
              GitHub Contributions
            </text>

            <line
              x1="40"
              y1="62"
              x2="860"
              y2="62"
              stroke="#30363d"
            />

            <!-- Total Contributions -->

            <text
              x="180"
              y="110"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="34"
              font-weight="700"
              fill="#ffffff">
              {total}
            </text>

            <text
              x="180"
              y="137"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              fill="#8b949e">
              Total Contributions
            </text>

            <!-- Current Streak -->

            <text
              x="450"
              y="110"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="34"
              font-weight="700"
              fill="#ffffff">
              {current_streak}
            </text>

            <text
              x="450"
              y="137"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              fill="#8b949e">
              Current Streak
            </text>

            <!-- Longest Streak -->

            <text
              x="720"
              y="110"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="34"
              font-weight="700"
              fill="#ffffff">
              {longest_streak}
            </text>

            <text
              x="720"
              y="137"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              fill="#8b949e">
              Longest Streak
            </text>

            <text
              x="450"
              y="185"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              fill="#8b949e">
              Live data from GitHub Contribution Calendar
            </text>

          </svg>
          '''

          os.makedirs("profile", exist_ok=True)

          with open("profile/contributions.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print(f"Total Contributions: {total}")
          print(f"Current Streak: {current_streak}")
          print(f"Longest Streak: {longest_streak}")
          PY

      # ==============================
      # Commit Generated SVGs
      # ==============================

      - name: Commit Analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update GitHub analytics"
            git push
          fi

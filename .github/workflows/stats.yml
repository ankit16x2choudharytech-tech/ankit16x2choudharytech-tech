name: Update GitHub Analytics

on:
  schedule:
    # Update every 6 hours
    - cron: "0 */6 * * *"https://github.com/ankit16x2choudharytech-tech/ankit16x2choudharytech-tech/edit/main/.github/workflows/stats.yml

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==============================
      # Checkout Repository
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==============================
      # GitHub Stats
      # ==============================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true&rank_icon=github'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Top Languages
      # ==============================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Generate Real Contribution Card
      # ==============================

      - name: Generate Contribution Card
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import date, timedelta
          from xml.sax.saxutils import escape

          token = os.environ["GH_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as e:
              print("GitHub GraphQL API error:", e.read().decode())
              raise

          if "errors" in result:
              print(json.dumps(result["errors"], indent=2))
              raise SystemExit("GraphQL request failed")

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          # ==========================================
          # Current Streak
          # ==========================================

          current_streak = 0

          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          # ==========================================
          # Longest Streak
          # ==========================================

          longest_streak = 0
          running_streak = 0

          for day in days:
              if day["count"] > 0:
                  running_streak += 1
                  longest_streak = max(longest_streak, running_streak)
              else:
                  running_streak = 0

          # ==========================================
          # Generate SVG
          # ==========================================

          # ==========================================
          # Calculate Week Streaks
          # ==========================================

          from datetime import datetime, timedelta
          import math

          def get_date(value):
              return datetime.strptime(value, "%Y-%m-%d").date()

          today = date.today()

          contribution_days = []

          for day in days:
              contribution_days.append({
                  "date": get_date(day["date"]),
                  "count": day["count"]
              })

          contribution_days.sort(key=lambda x: x["date"])


          # ==========================================
          # Current Streak
          # ==========================================

          current_streak = 0
          current_start = None
          current_end = None

          if contribution_days:

              latest_date = contribution_days[-1]["date"]
              check_date = latest_date

              for day in reversed(contribution_days):

                  if day["date"] == check_date and day["count"] > 0:

                      if current_end is None:
                          current_end = day["date"]

                      current_streak += 1
                      current_start = day["date"]

                      check_date -= timedelta(days=1)

                  elif day["date"] < check_date:
                      break


          # ==========================================
          # Longest Streak
          # ==========================================

          longest_streak = 0
          running_streak = 0
          running_start = None

          longest_start = None
          longest_end = None

          for day in contribution_days:

              if day["count"] > 0:

                  if running_streak == 0:
                      running_start = day["date"]

                  running_streak += 1

                  if running_streak > longest_streak:
                      longest_streak = running_streak
                      longest_start = running_start
                      longest_end = day["date"]

              else:
                  running_streak = 0
                  running_start = None


          # ==========================================
          # Format Dates
          # ==========================================

          def format_date(d):

              if d is None:
                  return ""

              return d.strftime("%b %-d")


          if current_start and current_end:

              if current_start == current_end:
                  current_range = format_date(current_start)

              else:
                  current_range = (
                      f"{format_date(current_start)} - "
                      f"{format_date(current_end)}"
                  )

          else:
              current_range = "No active streak"


          if longest_start and longest_end:

              if longest_start == longest_end:
                  longest_range = format_date(longest_start)

              else:
                  longest_range = (
                      f"{format_date(longest_start)} - "
                      f"{format_date(longest_end)}"
                  )

          else:
              longest_range = "No streak"


          # ==========================================
          # SVG Configuration
          # ==========================================

          width = 900
          height = 350

          background = "#1a1b26"
          blue = "#6ea8ff"
          purple = "#c084fc"
          teal = "#2dd4bf"
          white = "#ffffff"
          separator = "#c7c7c7"


          # ==========================================
          # Streak Ring
          # ==========================================

          cx = 450
          cy = 126

          radius = 72

          circumference = 2 * math.pi * radius

          weekly_progress = min(current_streak / 7, 1)

          dash = circumference * weekly_progress


          # ==========================================
          # Generate SVG
          # ==========================================

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="{width}"
          height="{height}"
          viewBox="0 0 {width} {height}"
          role="img"
          aria-label="GitHub contribution analytics">

          <rect
              width="{width}"
              height="{height}"
              rx="10"
              fill="{background}"
          />


          <!-- ============================= -->
          <!-- LEFT SECTION -->
          <!-- ============================= -->

          <text
              x="150"
              y="143"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="52"
              font-weight="700"
              fill="{blue}">
              {total}
          </text>

          <text
              x="150"
              y="190"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="22"
              fill="{blue}">
              Total Contributions
          </text>

          <text
              x="150"
              y="225"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="18"
              fill="{teal}">
              {format_date(contribution_days[0]["date"])}
              -
              {format_date(contribution_days[-1]["date"])}
          </text>


          <!-- ============================= -->
          <!-- LEFT SEPARATOR -->
          <!-- ============================= -->

          <line
              x1="300"
              y1="48"
              x2="300"
              y2="305"
              stroke="{separator}"
              stroke-width="1"
          />


          <!-- ============================= -->
          <!-- CENTER STREAK RING -->
          <!-- ============================= -->

          <circle
              cx="{cx}"
              cy="{cy}"
              r="{radius}"
              fill="none"
              stroke="#24283b"
              stroke-width="10"
          />

          <circle
              cx="{cx}"
              cy="{cy}"
              r="{radius}"
              fill="none"
              stroke="{blue}"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="{dash} {circumference - dash}"
              transform="rotate(-90 {cx} {cy})"
          />


          <!-- ============================= -->
          <!-- FLAME ICON -->
          <!-- ============================= -->

          <path
              d="
              M450 35
              C462 50 458 60 470 69
              C480 78 478 95 466 103
              C458 109 445 111 437 103
              C426 94 428 78 438 68
              C445 61 449 52 450 35
              Z
              "
              fill="{blue}"
          />

          <path
              d="
              M450 65
              C456 73 460 80 457 87
              C455 94 449 98 444 94
              C439 90 440 82 445 76
              C448 72 449 68 450 65
              Z
              "
              fill="{background}"
          />


          <!-- ============================= -->
          <!-- STREAK NUMBER -->
          <!-- ============================= -->

          <text
              x="450"
              y="145"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="50"
              font-weight="700"
              fill="{purple}">
              {current_streak}
          </text>


          <!-- ============================= -->
          <!-- STREAK LABEL -->
          <!-- ============================= -->

          <text
              x="450"
              y="202"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="24"
              font-weight="700"
              fill="{purple}">
              Week Streak
          </text>

          <text
              x="450"
              y="240"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="18"
              fill="{teal}">
              {current_range}
          </text>


          <!-- ============================= -->
          <!-- RIGHT SEPARATOR -->
          <!-- ============================= -->

          <line
              x1="600"
              y1="48"
              x2="600"
              y2="305"
              stroke="{separator}"
              stroke-width="1"
          />


          <!-- ============================= -->
          <!-- RIGHT SECTION -->
          <!-- ============================= -->

          <text
              x="750"
              y="143"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="52"
              font-weight="700"
              fill="{blue}">
              {longest_streak}
          </text>

          <text
              x="750"
              y="190"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="22"
              fill="{blue}">
              Longest Week Streak
          </text>

          <text
              x="750"
              y="225"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="18"
              fill="{teal}">
              {longest_range}
          </text>

          </svg>
          '''


          # ==========================================
          # Save SVG
          # ==========================================

          os.makedirs("profile", exist_ok=True)

          with open(
              "profile/contributions.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)


          print(f"Total Contributions: {total}")
          print(f"Current Streak: {current_streak}")
          print(f"Longest Streak: {longest_streak}")
          print(f"Current Range: {current_range}")
          print(f"Longest Range: {longest_range}")
          PY
          PY

      # ==============================
      # Commit Generated SVGs
      # ==============================

      - name: Commit Analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update GitHub analytics"
            git push
          fi

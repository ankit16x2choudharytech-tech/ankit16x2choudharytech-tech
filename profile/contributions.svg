<svg xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="230"
    viewBox="0 0 900 230"
    role="img"
    aria-label="GitHub contribution analytics">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8"
        flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect
    x="0"
    y="0"
    width="900"
    height="230"
    rx="16"
    fill="url(#bg)"
    stroke="#30363d"
    stroke-width="1"
    filter="url(#shadow)"
  />

  <text
    x="450"
    y="42"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#ffffff">
    GitHub Contributions
  </text>

  <line
    x1="40"
    y1="62"
    x2="860"
    y2="62"
    stroke="#30363d"
  />

  <!-- Total Contributions -->

  <text
    x="180"
    y="110"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#ffffff">
    150
  </text>

  <text
    x="180"
    y="137"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#8b949e">
    Total Contributions
  </text>

  <!-- Current Streak -->

  <text
    x="450"
    y="110"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#ffffff">
    4
  </text>

  <text
    x="450"
    y="137"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#8b949e">
    Current Streak
  </text>

  <!-- Longest Streak -->

  <text
    x="720"
    y="110"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#ffffff">
    5
  </text>

  <text
    x="720"
    y="137"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#8b949e">
    Longest Streak
  </text>

  <text
    x="450"
    y="185"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    fill="#8b949e">
    Live data from GitHub Contribution Calendar
  </text>

</svg>
